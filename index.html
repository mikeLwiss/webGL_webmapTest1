<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My GIS Web Map</title>

<!-- MapLibre CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
>

<style>

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }

    #map {
        width: 100%;
        height: 100%;
    }

</style>
```

</head>

<body>

```
<!-- Map container -->
<div id="map"></div>


<!-- Load our layer configuration -->
<script src="config/layers.js"></script>


<!-- Load MapLibre and initialize the map -->
<script type="module">

    import * as maplibregl
        from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';


    // --------------------------------------------------
    // CREATE THE MAP
    // --------------------------------------------------

    const map = new maplibregl.Map({

        container: 'map',

        style:
            'https://demotiles.maplibre.org/style.json',

        center: [0, 20],

        zoom: 2

    });


    // --------------------------------------------------
    // LOAD ALL GEOJSON LAYERS
    // --------------------------------------------------

    map.on('load', () => {

        layers.forEach(layer => {


            // Add the GeoJSON data source
            map.addSource(layer.id, {

                type: 'geojson',

                data: layer.file

            });


            // Add the layer to the map
            map.addLayer({

                id: layer.id,

                type: layer.type,

                source: layer.id,

                paint: {

                    [layer.type + '-color']:
                        layer.color,

                    [layer.type + '-opacity']:
                        layer.opacity

                }

            });

        });

    });


</script>
```

</body>

</html>


</html>
