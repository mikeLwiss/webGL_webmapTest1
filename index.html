<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My GIS Web Map</title>

    <!-- MapLibre CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    />

    <style>

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>

</head>


<body>

    <div id="map"></div>


    <script type="module">

        import * as maplibregl
            from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';


        // Create the map
        const map = new maplibregl.Map({

            container: 'map',

            style:
                'https://demotiles.maplibre.org/style.json',

            center: [0, 20],

            zoom: 2

        });


        // Wait for the map to load
        map.on('load', () => {


            // Add our GeoJSON
            map.addSource('sites', {

                type: 'geojson',

                data: 'data/NaturalMonumentSaoPedroSaoPaulo.geojson'

            });


            // Draw the polygons
            map.addLayer({

                id: 'sites',

                type: 'fill',

                source: 'sites',

                paint: {

                    'fill-color': '#008000',

                    'fill-opacity': 0.5,

                    'fill-outline-color': '#333333'

                }

            });


        });

    </script>

</body>

</html>
