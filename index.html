<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GIS Web Map</title>

    <!-- MapLibre CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    >
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Load the layer configuration -->
   <script src="config/layers.js"></script>

<script type="module">

    import * as maplibregl
        from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [0, 20],
        zoom: 2
    });

    map.on('load', async () => {
        for (const layer of layers) {
            let geojson;

            // --------------------------------------------------
            // LOCAL GEOJSON FILE
            // --------------------------------------------------
            if (layer.file) {
                const response = await fetch(layer.file);
                geojson = await response.json();
            }

            // --------------------------------------------------
            // ARCGIS FEATURE SERVICE
            // --------------------------------------------------
            if (layer.url) {
                const queryUrl =
                    layer.url +
                    '/query' +
                    '?where=1%3D1' +
                    '&outFields=*' +
                    '&returnGeometry=true' +
                    '&f=geojson';
                const response = await fetch(queryUrl);
                geojson = await response.json();
            }

            // --------------------------------------------------
            // ADD SOURCE
            // --------------------------------------------------
            map.addSource(layer.id, {
                type: 'geojson',
                data: geojson
            });

            // --------------------------------------------------
            // ADD MAP LAYER
            // --------------------------------------------------
            map.addLayer({
                id: layer.id,
                type: layer.type,
                source: layer.id,
                paint: {
                    'fill-color': layer.color,
                    'fill-opacity': layer.opacity,
                    'fill-outline-color': layer.outlineColor
                }
            });
        }
    });
</script>
